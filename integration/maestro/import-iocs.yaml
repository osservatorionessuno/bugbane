# Import the custom IOC fixture (run.sh pushed it to /sdcard/Download/e2e-iocs.stix2)
# through Settings → Custom indicators → system file picker, then return home. Runs
# inside connect-acquire.yaml so the set is in place before the auto-analysis.
# IOCS_SHA256 (from run.sh) is the fixture's hash, asserted against the Settings row.
appId: org.osservatorionessuno.bugbane
---
# Right after pairing, the "Turn off Wireless Debugging" heads-up can sit over the top
# bar (API 30 in CI) and a tap on the gear opens Developer options instead. Let it
# collapse first, and back out of system Settings if a tap still lands there.
- extendedWaitUntil:
    notVisible: "^Turn off Wireless Debugging$"
    timeout: 20000
- repeat:
    times: 3
    while:
      notVisible: "Indicators of Compromise (IoCs)"
    commands:
      - runFlow:
          when:
            visible: "Search settings"
          commands:
            - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: "Settings"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "Indicators of Compromise (IoCs)"
    timeout: 15000
# The card sits below the fold of the settings list.
- scrollUntilVisible:
    element:
      text: "Import indicators file"
    direction: DOWN
    timeout: 20000
- tapOn: "Import indicators file"
# DocumentsUI: the pushed file normally shows under Recent; otherwise browse the
# Downloads root from the drawer.
- extendedWaitUntil:
    visible:
      text: ".*(Recent|Downloads|e2e-iocs).*"
    timeout: 20000
- runFlow:
    when:
      notVisible:
        text: "e2e-iocs.*"
    commands:
      - tapOn: "Show roots"
      - tapOn: "Downloads"
      - extendedWaitUntil:
          visible:
            text: "e2e-iocs.*"
          timeout: 10000
- tapOn:
    text: "e2e-iocs.*"
# Back in Settings the imported row shows name, indicator count and SHA-256.
- extendedWaitUntil:
    visible:
      text: "2 indicators.*"
    timeout: 30000
- assertVisible: "e2e-iocs.stix2"
- assertVisible:
    text: ".*${IOCS_SHA256}.*"
- takeScreenshot: screenshots/03b-custom-iocs-imported
- pressKey: Back
- extendedWaitUntil:
    visible: "Start Acquisition"
    timeout: 15000
