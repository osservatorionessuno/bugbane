# Enter the pairing code, then acquire + export — in ONE flow so there is no
# maestro-restart gap between pairing completing and acquisition (in that gap the
# wireless connection drops and the app reverts to the pair page, esp. on userdebug).
# The notification shade is already open (run.sh: `cmd statusbar expand-notifications`,
# reliable — the swipe gesture misses over the pairing dialog on CI). CODE is passed
# with `maestro test -e CODE=<6 digits>`.
appId: org.osservatorionessuno.bugbane
---
# CODE is empty when the device accepted the connection without pairing (run.sh).
- runFlow:
    when:
      true: ${CODE != ''}
    commands:
      - extendedWaitUntil:
          visible:
            text: ".*(${s_notification_adb_pairing_input_code}|${s_notification_adb_pairing_service_found_title}|${s_notification_adb_pairing_working_title}).*"
          timeout: 60000
      # Expand bugbane's notification if the inline-reply action isn't already showing.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  notVisible: "${s_notification_adb_pairing_input_code}"
                commands:
                  - tapOn:
                      text: "Expand"
                      optional: true
                  - extendedWaitUntil:
                      visible: "${s_notification_adb_pairing_input_code}"
                      timeout: 6000
      - assertVisible: "${s_notification_adb_pairing_input_code}"
      - tapOn: "${s_notification_adb_pairing_input_code}"
      - inputText: "${CODE}"
      - pressKey: Enter
# Close the shade (Home is reliable) and land on the paired home screen. Settings runs
# inside bugbane's task, so stop it first: otherwise a leftover Settings screen (always
# when pairing was not needed, CODE empty) is what launchApp brings forward.
- pressKey: Home
- stopApp: com.android.settings
- launchApp
- extendedWaitUntil:
    visible:
      text: ".*(${s_slideshow_ready_title}|${s_slideshow_ready_button}|${s_scan_welcome_title}).*"
    timeout: 90000
- takeScreenshot: screenshots/03-ready-to-start
# Pairing lands on the last onboarding slide; the home screen (with Settings) is behind
# "Get Started".
- runFlow:
    when:
      visible: "${s_slideshow_ready_button}"
    commands:
      - tapOn: "${s_slideshow_ready_button}"
- extendedWaitUntil:
    visible: "${s_home_scan_button}"
    timeout: 20000
# Import the custom IOC set now (same process, so the wireless connection stays up),
# so the auto-analysis below runs against feed + custom indicators.
- runFlow: import-iocs.yaml
# --- acquisition + export (same flow, no relaunch gap after pairing) ---
- extendedWaitUntil:
    visible: "${s_home_scan_button}"
    timeout: 20000
- takeScreenshot: screenshots/04-acquire
- tapOn: "${s_home_scan_button}"
- extendedWaitUntil:
    visible: "${s_scan_cancel_button}"
    timeout: 30000
    optional: true
- takeScreenshot: screenshots/04b-acquiring
- extendedWaitUntil:
    visible: "${s_acquisition_details_export}"
    timeout: 1200000
- takeScreenshot: screenshots/05-acquisition-complete
# Auto-analysis right after; catch its dialog if it is still up (docs figure).
- runFlow:
    when:
      visible: "${s_analysis_in_progress}"
    commands:
      - takeScreenshot: screenshots/06-analysis-in-progress
# Auto-analysis runs after acquisition and disables Export until it finishes (slow on
# CI). CRITICAL is bugbane's own detection of the planted pred.so IOC (cross-checked
# against MVT host-side) and doubles as the analysis-done gate.
- extendedWaitUntil:
    visible:
      text: ".*CRITICAL.*"
    timeout: 300000
- takeScreenshot: screenshots/07-analysis-results
# The custom set must have matched too (its planted marker, see run.sh).
- runFlow: check-custom-ioc.yaml
# Tapping Export right after can race the SAF picker, so retry until SAVE shows.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible: "SAVE"
          commands:
            - tapOn: "${s_acquisition_details_export}"
            - extendedWaitUntil:
                visible: "SAVE"
                timeout: 20000
- assertVisible: "SAVE"
- tapOn: "SAVE"
# One-time passphrase dialog — left open for the host to scrape the 32-char value.
- extendedWaitUntil:
    visible: "${s_acquisition_passphrase_copy}"
    timeout: 120000
- takeScreenshot: screenshots/08-export-passphrase
