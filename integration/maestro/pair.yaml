# Onboarding + open the Settings pairing dialog. Ends with the 6-digit code on screen
# (dialog left open) so run.sh can scrape it and drive the notification shade via adb
# (reliable), then enter-code.yaml types the code.
appId: org.osservatorionessuno.bugbane
---
- launchApp:
    clearState: true
- runFlow: dismiss-anr.yaml
- extendedWaitUntil:
    visible: "Welcome to Bugbane"
    timeout: 60000
- takeScreenshot: screenshots/01-welcome
- tapOn:
    text: "^I understand$"
# Role slide: the default keeps the install in user mode (this device is scanned).
- extendedWaitUntil:
    visible: "Check this device"
    timeout: 15000
- tapOn: "Check this device"
# CVE vulnerability page: API 34-36 only.
- runFlow:
    when:
      visible: "I understand, continue anyway"
    commands:
      - tapOn: "I understand, continue anyway"
# Developer options page (only when off): enable the real way via Build number x7.
- runFlow:
    when:
      visible: "Enable Developer Options"
    commands:
      - tapOn:
          text: "Enable"
      # Settings can take a while to come up on a slow emulator.
      - extendedWaitUntil:
          visible:
            text: ".*(About|Build number).*"
          timeout: 45000
      - scrollUntilVisible:
          element:
            text: "Build number"
          direction: DOWN
          timeout: 40000
      - repeat:
          times: 7
          commands:
            - tapOn: "Build number"
      # Bugbane brings the wizard back on its own once the setting flips. Give it a few
      # seconds; Back is only the fallback, since Back on the wizard itself quits the app.
      - extendedWaitUntil:
          visible: "Enable Wireless Debugging and Pair"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            notVisible: "Enable Wireless Debugging and Pair"
          commands:
            - pressKey: Back
- extendedWaitUntil:
    visible: "Enable Wireless Debugging and Pair"
    timeout: 25000
- takeScreenshot: screenshots/02-pair-wizard
- tapOn: "Pair"
# The app deep-links into Developer options, which animates and scrolls to the row.
# Settings layouts differ per API level, so act on whatever is on screen until the
# pairing entry appears: the network dialog, the subscreen toggle, the row, or scroll.
- extendedWaitUntil:
    visible: "Developer options"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 10
    while:
      notVisible: "Pair device with pairing code"
    commands:
      - runFlow:
          when:
            visible:
              text: ".*Allow wireless debugging on this network.*"
          commands:
            - tapOn:
                text: "Allow"
                optional: true
      # Subscreen with debugging off (the description only shows while it is off).
      # API 31+ has a labelled toggle, API 30 a bare master switch (id switch_bar).
      - runFlow:
          when:
            visible:
              text: ".*turn on wireless debugging.*"
            notVisible:
              text: ".*Allow wireless debugging on this network.*"
          commands:
            - runFlow:
                when:
                  visible: "Use wireless debugging"
                commands:
                  - tapOn:
                      containsChild: "Use wireless debugging"
                      optional: true
            - runFlow:
                when:
                  notVisible: "Use wireless debugging"
                commands:
                  - tapOn:
                      id: "switch_bar"
                      optional: true
      # Developer options list: open the row by its summary. The row's switch is also
      # labelled "Wireless debugging", so that text selects the switch when the title
      # is scrolled off screen and toggles debugging instead of opening the screen.
      - runFlow:
          when:
            visible: "Debug mode when Wi.Fi is connected"
            notVisible:
              text: ".*(Use wireless debugging|turn on wireless debugging|Allow wireless debugging on this network).*"
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                text: "Debug mode when Wi.Fi is connected"
                optional: true
      # Row not on screen: look up, then down.
      - runFlow:
          when:
            notVisible:
              text: ".*(Debug mode when Wi.Fi is connected|Use wireless debugging|turn on wireless debugging|Allow wireless debugging on this network|Pair device with).*"
          commands:
            - scrollUntilVisible:
                element:
                  text: "Debug mode when Wi.Fi is connected"
                  optional: true
                direction: UP
                timeout: 10000
            - scrollUntilVisible:
                element:
                  text: "Debug mode when Wi.Fi is connected"
                  optional: true
                direction: DOWN
                timeout: 20000
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "Pair device with pairing code"
    timeout: 30000
- tapOn:
    containsChild: "Pair device with pairing code"
# Leave the dialog open with the 6-digit code visible for run.sh to scrape.
- extendedWaitUntil:
    visible:
      text: "[0-9]{6}"
    timeout: 20000
