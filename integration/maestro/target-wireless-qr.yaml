# Target: turn on Wireless debugging and open the QR pairing scanner. Developer
# options were enabled by the harness. The camera shows the emulator's virtual scene,
# whose wall poster the harness has set to the analyst's pairing QR.
appId: com.android.settings
---
- launchApp
- runFlow: dismiss-anr.yaml
- scrollUntilVisible:
    element:
      text: "System"
    direction: DOWN
    timeout: 30000
- tapOn: "System"
- scrollUntilVisible:
    element:
      text: "Developer options"
    direction: DOWN
    timeout: 30000
- tapOn: "Developer options"
- extendedWaitUntil:
    visible: "Use developer options"
    timeout: 30000
# Act on whatever is on screen until the pairing entries appear (see pair.yaml).
- repeat:
    times: 10
    while:
      notVisible: "Pair device with QR code"
    commands:
      - runFlow:
          when:
            visible:
              text: ".*Allow wireless debugging on this network.*"
          commands:
            - tapOn:
                text: "Allow"
                optional: true
      - runFlow:
          when:
            visible:
              text: ".*turn on wireless debugging.*"
            notVisible:
              text: ".*Allow wireless debugging on this network.*"
          commands:
            - tapOn:
                containsChild: "Use wireless debugging"
                optional: true
      # Developer options list: open the row by its summary. The row's switch is also
      # labelled "Wireless debugging", so that text selects the switch when the title
      # is scrolled off screen and toggles debugging instead of opening the screen.
      - runFlow:
          when:
            visible: "Debug mode when Wi.Fi is connected"
            notVisible:
              text: ".*(Use wireless debugging|turn on wireless debugging|Allow wireless debugging on this network).*"
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                text: "Debug mode when Wi.Fi is connected"
                optional: true
      - runFlow:
          when:
            notVisible:
              text: ".*(Debug mode when Wi.Fi is connected|Use wireless debugging|turn on wireless debugging|Allow wireless debugging on this network|Pair device with).*"
          commands:
            - scrollUntilVisible:
                element:
                  text: "Debug mode when Wi.Fi is connected"
                  optional: true
                direction: DOWN
                timeout: 40000
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "Pair device with QR code"
    timeout: 30000
- takeScreenshot: screenshots/b01-wireless-debugging
- tapOn:
    containsChild: "Pair device with QR code"
# If the camera already faces the poster the scanner pairs at once and closes again.
- extendedWaitUntil:
    visible:
      text: ".*(Scan QR code|Pairing device|Paired devices).*"
    timeout: 20000
