# Fill both password fields and submit, retyping if a keystroke was lost while the
# keyboard was opening (/e/OS: the first field came up one character short). The
# confirm field sits behind the IME, so the keyboard is hidden between fields.
appId: org.osservatorionessuno.bugbane
---
- repeat:
    times: 3
    while:
      visible: "Set password"
    commands:
      - tapOn: "Password"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 40
      - inputText: "bugbane-e2e-pass1"
      - hideKeyboard
      - tapOn: "Confirm password"
      - waitForAnimationToEnd:
          timeout: 2000
      - eraseText: 40
      - inputText: "bugbane-e2e-pass1"
      - hideKeyboard
      - tapOn: "Set password"
      - waitForAnimationToEnd:
          timeout: 3000
