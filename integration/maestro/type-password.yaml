# Fill both password fields and submit. If the acquisition screen does not come
# back, both fields are cleared and retyped, twice at most.
appId: org.osservatorionessuno.bugbane
---
- runFlow:
    file: fill-password-field.yaml
    env:
      FIELD: "${s_set_password_field_label}"
- runFlow:
    file: fill-password-field.yaml
    env:
      FIELD: "${s_set_password_confirm_label}"
- tapOn: "${s_set_password_set_button}"
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 2
    while:
      visible: "${s_set_password_set_button}"
    commands:
      - runFlow:
          file: clear-password-field.yaml
          env:
            FIELD: "${s_set_password_field_label}"
      - runFlow:
          file: fill-password-field.yaml
          env:
            FIELD: "${s_set_password_field_label}"
      - runFlow:
          file: clear-password-field.yaml
          env:
            FIELD: "${s_set_password_confirm_label}"
      - runFlow:
          file: fill-password-field.yaml
          env:
            FIELD: "${s_set_password_confirm_label}"
      - tapOn: "${s_set_password_set_button}"
      - waitForAnimationToEnd:
          timeout: 3000
