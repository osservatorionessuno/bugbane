# Fill both password fields and submit. If the acquisition screen does not come
# back, both fields are cleared and retyped, twice at most.
appId: org.osservatorionessuno.bugbane
---
- runFlow:
    file: fill-password-field.yaml
    env:
      FIELD: "Password"
- runFlow:
    file: fill-password-field.yaml
    env:
      FIELD: "Confirm password"
- tapOn: "Set password"
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 2
    while:
      visible: "Set password"
    commands:
      - runFlow:
          file: clear-password-field.yaml
          env:
            FIELD: "Password"
      - runFlow:
          file: fill-password-field.yaml
          env:
            FIELD: "Password"
      - runFlow:
          file: clear-password-field.yaml
          env:
            FIELD: "Confirm password"
      - runFlow:
          file: fill-password-field.yaml
          env:
            FIELD: "Confirm password"
      - tapOn: "Set password"
      - waitForAnimationToEnd:
          timeout: 3000
