# Close the passphrase dialog and set the mandatory acquisition password. Runs
# after the host has scraped the passphrase from the still-open dialog.
appId: org.osservatorionessuno.bugbane
---
- tapOn: "Close"
- pressKey: Back
# Leaving the acquisition detail with no device screen lock forces the password screen.
- extendedWaitUntil:
    visible: "Set an acquisition password"
    timeout: 15000
- takeScreenshot: screenshots/08-set-password
- runFlow: type-password.yaml
# /e/OS's password manager can still throw a "Save credentials" sheet over the app
# (backup for the autofill disable in run.sh; no-op elsewhere).
- runFlow:
    when:
      visible: ".*Save credentials.*"
    commands:
      - tapOn: "Discard"
- extendedWaitUntil:
    visible:
      text: ".*(Acquire Data|Start Acquisition).*"
    timeout: 20000
