# Analyst onboarding on a fresh install: role slide → password (no hardware keystore
# on emulators, so the lock gate is the PIN the harness set) → home.
appId: org.osservatorionessuno.bugbane
---
- launchApp:
    clearState: true
- runFlow: dismiss-anr.yaml
- extendedWaitUntil:
    visible:
      text: ".*(${s_slideshow_welcome_title}|Unlock for all features and data|Enter your PIN).*"
    timeout: 60000
# Android 16 emulators can lock while a flow runs; the harness PIN is 1234.
- runFlow:
    when:
      visible:
        text: ".*(Unlock for all features and data|Enter your PIN).*"
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 30%"
      - inputText: "1234"
      - pressKey: Enter
- extendedWaitUntil:
    visible: "${s_slideshow_welcome_title}"
    timeout: 60000
- tapOn:
    text: "^${s_slideshow_welcome_button}$"
- extendedWaitUntil:
    visible: "${s_slideshow_role_user_button}"
    timeout: 15000
- takeScreenshot: screenshots/a01-role
- tapOn: "${s_slideshow_role_analyst_button}"
# Choosing analyst swaps the launcher alias and restarts the app in a new task.
- extendedWaitUntil:
    visible: "${s_slideshow_protection_title}"
    timeout: 60000
- takeScreenshot: screenshots/a02-protection
- tapOn: "${s_protection_set_password}"
- extendedWaitUntil:
    visible: "${s_set_password_title}"
    timeout: 15000
- runFlow: type-password.yaml
- extendedWaitUntil:
    visible: "${s_slideshow_ready_button}"
    timeout: 30000
- tapOn: "${s_slideshow_ready_button}"
- extendedWaitUntil:
    visible: "${s_home_scan_device_button}"
    timeout: 20000
- takeScreenshot: screenshots/a03-home
