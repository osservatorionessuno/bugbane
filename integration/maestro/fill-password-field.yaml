# Type the E2E password into the field labelled ${FIELD}, which must be empty.
# /e/OS can swallow the first keystroke while the keyboard opens: a throwaway
# character goes first and is erased, so whether or not it was swallowed the
# field is empty when the real password is typed.
# The confirm field sits behind the IME, so the keyboard is hidden afterwards.
appId: org.osservatorionessuno.bugbane
---
- tapOn: "${FIELD}"
- waitForAnimationToEnd:
    timeout: 2000
- inputText: "x"
- eraseText: 1
- inputText: "bugbane-e2e-pass1"
- hideKeyboard
