# Empty the field labelled ${FIELD}. Tapping the label lands the cursor a few
# characters into the text and Backspace only deletes before the cursor, so one
# tap-and-erase removes a handful of characters. Repeat: once the text is shorter
# than the tap point the cursor falls at the end and the erase takes the rest.
appId: org.osservatorionessuno.bugbane
---
- repeat:
    times: 8
    commands:
      - tapOn: "${FIELD}"
      - eraseText: 40
- hideKeyboard
