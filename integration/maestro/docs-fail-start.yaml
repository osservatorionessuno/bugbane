# Docs figures only (run.sh ignores failures): start a second acquisition and leave it
# running; run.sh then turns Wireless debugging off under it so modules fail.
appId: org.osservatorionessuno.bugbane
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "${s_home_scan_button}"
    timeout: 30000
- tapOn: "${s_home_scan_button}"
- extendedWaitUntil:
    visible: "${s_scan_cancel_button}"
    timeout: 30000
