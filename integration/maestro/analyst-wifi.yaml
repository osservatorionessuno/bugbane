# Analyst: open the scan wizard, pick Wi-Fi, let the Wi-Fi Direct group form, then
# reach the pairing QR (left on screen for the host to decode).
appId: org.osservatorionessuno.bugbane
---
# Android 16 emulators can lock while a flow runs; the harness PIN is 1234.
- runFlow:
    when:
      visible:
        text: ".*(Unlock for all features and data|Enter your PIN).*"
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 30%"
      - inputText: "1234"
      - pressKey: Enter
# The title and the button share the text; the button comes second.
- tapOn:
    text: "${s_home_scan_device_button}"
    index: 1
- extendedWaitUntil:
    visible: "${s_remote_transport_title}"
    timeout: 15000
- takeScreenshot: screenshots/a03b-transport
- tapOn: "(${s_remote_transport_wifi_direct_button}|${s_remote_transport_hotspot_button})"
- extendedWaitUntil:
    visible: "${s_remote_hotspot_title}"
    timeout: 15000
# Group up: the wizard shows the generated SSID.
- extendedWaitUntil:
    visible:
      text: "DIRECT-bb-bugbane-.*"
    timeout: 60000
- takeScreenshot: screenshots/a04-network-qr
- tapOn: "${s_remote_next_button}"
- extendedWaitUntil:
    visible: "${s_remote_wifi_waiting}"
    timeout: 15000
- takeScreenshot: screenshots/a05-pairing-qr
