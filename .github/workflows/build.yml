name: Build

on:
  workflow_call:
    inputs:
      ref_sha:
        required: true
        type: string
      repo_full_name:
        required: true
        type: string
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          repository: ${{ inputs.repo_full_name }}
          ref: ${{ inputs.ref_sha }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Stable env
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "LANG=C.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=C.UTF-8" >> $GITHUB_ENV
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct ${{ inputs.ref_sha }})" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: |
            platforms;android-36 build-tools;36.0.0

      - name: Build with Gradle
        run: ./gradlew --no-daemon assembleProductionDebug assembleProductionRelease

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-production-debug-${{ matrix.os }}
          path: app/build/outputs/apk/production/debug/app-production-debug.apk
          compression-level: 0
          retention-days: 7

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-production-release-${{ matrix.os }}
          path: app/build/outputs/apk/production/release/app-production-release-unsigned.apk
          compression-level: 0
          retention-days: 7
