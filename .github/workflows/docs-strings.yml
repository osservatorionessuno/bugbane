# A renamed or removed UI label must be reflected in the website docs that quote it.
# Runs the website's own check (bugbane-website/tools/check_docs.py) against this tree.
name: Docs strings

on:
  pull_request:
    paths: [ 'app/src/main/res/values*/strings.xml' ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: app/src/main/res
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: osservatorionessuno/bugbane-website
          path: website
      - run: python3 -I website/tools/check_docs.py . website
